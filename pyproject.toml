[project]
name = "wikipedia-trend-agent"
version = "0.1.0"
description = "Wikipedia Pageviews trend analysis agent skill (stdlib-thin: matplotlib is the sole runtime dependency)"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.11"]

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
mypy_path = ["scripts"]

# matplotlib ships no complete type information, and the repository's gate is
# `mypy scripts --strict`. Without this override mypy follows matplotlib into
# numpy's bundled stubs, which use 3.12+ `type` statement syntax that
# `python_version = "3.11"` cannot parse - so the run aborts on a THIRD-PARTY
# file before it has checked a line of this project's code. Scoped to matplotlib
# alone: it is the single permitted relaxation, there is no `# type: ignore`
# anywhere in the stage module, and every other import in `scripts/` stays fully
# checked.
[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*"]
ignore_missing_imports = true
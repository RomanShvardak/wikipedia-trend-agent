[project]
name = "wikipedia-trend-agent"
version = "0.1.0"
description = "Wikipedia Pageviews trend analysis agent skill (stdlib-thin: matplotlib is the sole runtime dependency)"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.11"]

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
mypy_path = ["scripts"]